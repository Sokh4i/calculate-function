<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- login form -->
<main class="login-page">
  <div class="login-card">

    <div class="login-art" aria-hidden="true">
      <svg viewBox="0 0 440 520" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gA" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#7c3aed"/><stop offset=".55" stop-color="#3b6cff"/><stop offset="1" stop-color="#3ee0ff"/>
          </linearGradient>
          <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f05cf0"/><stop offset="1" stop-color="#5b3cf0"/>
          </linearGradient>
          <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1">
            <stop offset=".62" stop-color="#0b0a26" stop-opacity="0"/><stop offset="1" stop-color="#0b0a26" stop-opacity=".9"/>
          </linearGradient>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
          <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
        </defs>
        <rect width="440" height="520" fill="#120f3a"/>
        <!-- glow behind ribbons -->
        <ellipse cx="120" cy="180" rx="170" ry="90" fill="#5b3cf0" opacity=".55" filter="url(#softer)"/>
        <ellipse cx="330" cy="330" rx="150" ry="80" fill="#f05cf0" opacity=".35" filter="url(#softer)"/>
        <!-- ribbons running bottom-left to top-right -->
        <path d="M-20 400 C 90 380, 150 250, 250 230 S 400 120, 470 60 L 470 150 C 400 210, 330 300, 240 320 S 80 470, -20 470 Z" fill="url(#gA)" opacity="1" filter="url(#soft)"/>
        <path d="M-20 330 C 70 330, 140 220, 230 200 S 380 160, 470 120 L 470 160 C 380 220, 300 260, 220 270 S 70 380, -20 380 Z" fill="url(#gB)" opacity=".85" filter="url(#soft)"/>
        <path d="M-20 470 C 100 440, 200 400, 280 380 S 400 330, 470 300 L 470 330 C 400 370, 300 430, 220 445 S 80 500, -20 500 Z" fill="#3ee0ff" opacity=".45" filter="url(#soft)"/>
        <!-- thin sharp highlight lines -->
        <path d="M-10 365 C 100 350, 160 240, 255 215 S 390 130, 460 85" fill="none" stroke="#bff6ff" stroke-width="1.6" opacity=".8"/>
        <path d="M-10 345 C 90 335, 150 235, 240 212 S 380 150, 460 108" fill="none" stroke="#ffd0ff" stroke-width="1" opacity=".6"/>
        <rect width="440" height="520" fill="url(#gC)"/>
      </svg>
      <div class="art-caption">
        <b>Plan every payment, month by month.</b>
        <span>Installment schedules in a few clicks.</span>
      </div>
    </div>

    <div class="login-form">
      <div class="brand"><span class="brand-dot"></span>Payment Calculator</div>
      <h2>Welcome back</h2>
      <p class="hint">Sign in with your username and password.</p>
      <label for="txtUsername">Username</label>
      <input id="txtUsername" type="text" placeholder="Username">
      <label for="txtPassword">Password</label>
      <input id="txtPassword" type="password" placeholder="Password">
      <button id="btnShow">Login</button>
    </div>

  </div>
</main>

<script src="js/code.js"></script>
</body>
</html>
