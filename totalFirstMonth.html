<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payment Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- page buttons -->
<div class="tabs noprint">
    <a class="tab" href="fixedPayment.html">បង់ថេរ</a>
    <a class="tab" href="decreasingInterest.html">បង់ថេរ ថយដើម</a>
    <a class="tab" href="paidPer3Month.html">៣ ខែបង់ម្តង</a>
    <a class="tab on" href="totalFirstMonth.html">បង់ថេរ បូកការខែទី១</a>
    <a class="tab out" href="index.html">Logout</a>
</div>

<!-- input form -->
<div class="card noprint" id="form">
  <h2>Input Information</h2>
  <div class="grid">
    <div><label for="product">Product Name</label><input type="text" id="product" value="F 900 XR" placeholder="Enter product name" required></div>
    <div><label for="price">Price ($)</label><input type="number" id="price" value="1250" min="1" step="10" required></div>
    <div><label for="duration">Duration (months)</label><input type="number" id="duration" value="7" min="1" required></div>
    <div><label for="interest">Interest (%)</label><input type="number" id="interest" value="1.5" min="0" step="0.5" required></div>
    <div><label for="principal">Principal ($/month)</label><input type="number" id="principal" value="0" min="0" step="10" required></div>
    <div><label for="date">Start Date</label><input type="date" id="date" value="2026-10-06" required></div>
  </div>
  <button id="btnShow">Show</button>
</div>

<!-- the table is built by JavaScript here -->
<div id="tbl"></div>

<script src="js/totalFirstMonth.js"></script>
</body>
</html>
